<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Facial Attribute Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0a0b;
    --card: #151516;
    --surface-2: #1f1f21;
    --border: rgba(255,255,255,0.08);
    --text-primary: #f2f2f3;
    --text-secondary: #8b8b90;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 50% -10%, #1a1a1c 0%, transparent 55%),
      var(--bg);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page{
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 60px; 
    padding: 40px 20px;
    flex-wrap: wrap;
    transition: all 0.4s ease;
  }

  .card{
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 30px 60px -25px rgba(0,0,0,0.7);
    padding: 40px 32px;
    text-align: center;
    flex-shrink: 0;
  }

  h1{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 25px;
    letter-spacing: -0.02em;
    margin: 0 0 8px;
  }

  .subtitle{
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--text-secondary);
    margin: 0 0 28px;
  }

  .upload-row{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }

  .visually-hidden{
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0; padding: 0; margin: -1px;
  }

  .file-btn{
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    padding: 9px 18px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-primary);
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
    white-space: nowrap;
  }
  .file-btn:hover{ background: #262628; border-color: rgba(255,255,255,0.18); }
  #imageInput:focus-visible + .file-btn{
    outline: 2px solid rgba(255,255,255,0.55);
    outline-offset: 2px;
  }

  .frame-wrap{
    width: min(280px, 100%);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .preview-frame{
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 5;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .preview-frame img{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
    z-index: 1;
  }

  .preview-frame::before{
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(120% 120% at 50% 0%, transparent 55%, rgba(0,0,0,0.35) 100%);
    pointer-events: none;
    z-index: 2;
  }

  .frame-placeholder{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-secondary);
    z-index: 1;
  }

  .corner{
    position: absolute;
    width: 16px; height: 16px;
    border-color: rgba(255,255,255,0.4);
    border-style: solid;
    border-width: 0;
    z-index: 3;
  }
  .corner.tl{ top: 10px; left: 10px; border-top-width: 2px; border-left-width: 2px; border-top-left-radius: 4px; }
  .corner.tr{ top: 10px; right: 10px; border-top-width: 2px; border-right-width: 2px; border-top-right-radius: 4px; }
  .corner.bl{ bottom: 10px; left: 10px; border-bottom-width: 2px; border-left-width: 2px; border-bottom-left-radius: 4px; }
  .corner.br{ bottom: 10px; right: 10px; border-bottom-width: 2px; border-right-width: 2px; border-bottom-right-radius: 4px; }

  .preview-frame.scanning::after{
    content: '';
    position: absolute;
    left: 6%; right: 6%;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
    box-shadow: 0 0 12px rgba(255,255,255,0.5);
    z-index: 4;
    animation: scan 1.6s ease-in-out infinite alternate;
  }
  @keyframes scan{
    0%{ top: 8%; opacity: 0.2; }
    50%{ opacity: 1; }
    100%{ top: 92%; opacity: 0.2; }
  }

  .analyze-btn{
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 12px 20px;
    border-radius: 12px;
    border: none;
    background: var(--text-primary);
    color: #0a0a0b;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
  }
  .analyze-btn:hover:not(:disabled){ background: #ffffff; transform: translateY(-1px); }
  .analyze-btn:disabled{ background: var(--surface-2); color: var(--text-secondary); cursor: not-allowed; }
  .analyze-btn:focus-visible{ outline: 2px solid rgba(255,255,255,0.55); outline-offset: 2px; }

  .results-panel {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    width: 100%;
    max-width: 600px;
    align-content: center;
  }

  .empty-state {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 400px;
  }

  .empty-state h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 56px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.15); 
    margin: 0 0 10px;
    line-height: 1.1;
  }

  .large-result-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 50px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 15px;
    box-shadow: 0 30px 60px -25px rgba(0,0,0,0.7);
    text-align: center;
    animation: fade-in 0.4s ease forwards;
  }

  @keyframes fade-in {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .large-result-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-secondary);
  }

  .large-result-value {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 32px;
  }
  .large-result-value.is-yes { color: #ffffff; font-weight: 700; }
  .large-result-value.is-no { color: var(--text-secondary); font-weight: 500; }

  .status-text{
    font-size: 16px;
    color: var(--text-secondary);
    text-align: center;
    padding: 20px 0;
  }
  .status-text.error{ color: #ff5555; font-weight: 500; }

  @media (max-width: 968px){
    .page { flex-direction: column; gap: 40px; }
    .results-panel { max-width: 420px; }
  }

  @media (max-width: 480px){
    .results-panel { grid-template-columns: 1fr; }
    .card { padding: 32px 22px; }
    h1 { font-size: 22px; }
    .empty-state h2 { font-size: 40px; }
  }
</style>
</head>
<body>
  <div class="page" id="page">
    <main class="card">
      <h1>Facial Attribute Analyzer</h1>
      <p class="subtitle">Upload a portrait to run the multi-task classifier.</p>

      <div class="upload-row">
        <input type="file" id="imageInput" class="visually-hidden" accept="image/*">
        <label class="file-btn" for="imageInput">Choose Image</label>
      </div>

      <div class="frame-wrap">
        <div class="preview-frame" id="previewFrame">
          <span class="corner tl"></span>
          <span class="corner tr"></span>
          <span class="corner bl"></span>
          <span class="corner br"></span>
          <img id="preview" alt="Selected portrait">
          <p class="frame-placeholder" id="framePlaceholder">No image yet</p>
        </div>
        <button class="analyze-btn" id="analyzeBtn" disabled>Analyze Face</button>
      </div>
    </main>

    <aside class="results-panel" id="resultsPanel">
      <div class="empty-state" id="emptyState">
        <h2>Facial Attribute Analyzer</h2>
      </div>
    </aside>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const preview = document.getElementById('preview');
    const framePlaceholder = document.getElementById('framePlaceholder');
    const previewFrame = document.getElementById('previewFrame');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const resultsPanel = document.getElementById('resultsPanel');

    const defaultEmptyState = resultsPanel.innerHTML;

    imageInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        preview.src = reader.result;
        preview.style.display = 'block';
        framePlaceholder.style.display = 'none';
      };
      reader.readAsDataURL(file);

      analyzeBtn.disabled = false;
      resultsPanel.innerHTML = defaultEmptyState;
    });

    analyzeBtn.addEventListener('click', async () => {
      const file = imageInput.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('file', file);

      const originalLabel = analyzeBtn.textContent;
      analyzeBtn.disabled = true;
      analyzeBtn.textContent = 'Analyzing…';
      previewFrame.classList.add('scanning');

      resultsPanel.innerHTML = `
        <div class="empty-state">
          <p class="status-text">Analyzing image features…</p>
        </div>
      `;

      try {
        const response = await fetch('/predict', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) throw new Error('Prediction request failed');

        const data = await response.json();
        renderResults(data);
      } catch (error) {
        console.error('Error:', error);
        resultsPanel.innerHTML = `
          <div class="empty-state">
            <p class="status-text error">Analysis failed. Check server logs.</p>
          </div>
        `;
      } finally {
        previewFrame.classList.remove('scanning');
        analyzeBtn.disabled = false;
        analyzeBtn.textContent = originalLabel;
      }
    });

    function renderResults(data) {
      const entries = Object.entries(data);

      resultsPanel.innerHTML = entries.map(([key, value]) => {
        const label = key.replace(/_/g, ' ');
        // Since the backend now returns purely a string ("Yes" or "No"), we only process that string.
        // We added a fallback check here just in case an old dict format accidentally makes it through.
        const prediction = (value && typeof value === 'object') ? value.prediction : value;
        const isYes = String(prediction).toLowerCase() === 'yes';

        // Display updated without the confidence variable appended
        return `
          <div class="large-result-box">
            <span class="large-result-label">${label}</span>
            <span class="large-result-value ${isYes ? 'is-yes' : 'is-no'}">${prediction}</span>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
